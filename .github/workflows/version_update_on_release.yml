name: Prepare LevelPlay release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version and tag (for example, 2.0.0)
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: Release version and tag (for example, 2.0.0)
        required: true
        type: string

concurrency:
  group: prepare-levelplay-release
  cancel-in-progress: false

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must be a SemVer release in MAJOR.MINOR.PATCH format without a v prefix."
            exit 1
          fi

          git check-ref-format "refs/tags/${RELEASE_VERSION}"
          if git show-ref --verify --quiet "refs/tags/${RELEASE_VERSION}"; then
            echo "::error::Tag ${RELEASE_VERSION} already exists. Published tags are immutable."
            exit 1
          fi

      - name: Update version in ext.properties
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PROPERTIES_FILE: extension-levelplay/ext.properties
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(grep -Ec '^version\.default[[:space:]]*=' "${PROPERTIES_FILE}")" -ne 1 ]]; then
            echo "::error::Expected exactly one version.default entry in ${PROPERTIES_FILE}."
            exit 1
          fi

          sed -i -E \
            "s/^version\.default[[:space:]]*=.*/version.default = ${RELEASE_VERSION}/" \
            "${PROPERTIES_FILE}"
          grep -Fxq "version.default = ${RELEASE_VERSION}" "${PROPERTIES_FILE}"

      - name: Commit version and create release tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add extension-levelplay/ext.properties
          if ! git diff --cached --quiet; then
            git commit -m "Prepare LevelPlay ${RELEASE_VERSION}"
          fi

          git tag --annotate "${RELEASE_VERSION}" \
            --message "LevelPlay ${RELEASE_VERSION}"
          git push --atomic origin \
            "HEAD:refs/heads/${TARGET_BRANCH}" \
            "refs/tags/${RELEASE_VERSION}"
